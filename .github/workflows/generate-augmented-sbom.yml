name: Augment SBOM

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 3.12.1)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  augment-sbom:
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_ROLE_ARN: ${{ vars.ECR_ROLE_ARN }}
      KONDUKTO_TOKEN: ${{ secrets.KONDUKTO_TOKEN }}
      KONDUKTO_REPO: ${{ vars.KONDUKTO_REPO }}
      KONDUKTO_BRANCH_PREFIX: ${{ vars.KONDUKTO_BRANCH_PREFIX }}
      SILKBOMB_IMG: ${{ vars.SILKBOMB_IMG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials for DevProd Platforms ECR
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Authenticate Docker to DevProd Platforms ECR
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker pull "${SILKBOMB_IMG}"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Augment SBOM with Kondukto
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./scripts/compliance/augment-sbom.sh

      - name: Generate SSDLC report
        env:
          AUTHOR: ${{ github.actor }}
          VERSION: ${{ inputs.release_version }}
          AUGMENTED_REPORT: "true"
        run: ./scripts/compliance/gen-ssdlc-report.sh

      - name: Upload augmented SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: augmented_sbom_and_ssdlc_report
          path: |
            compliance/v${{ inputs.release_version }}/augmented-sbom-v${{ inputs.release_version }}-${{ steps.date.outputs.date }}.json
            compliance/v${{ inputs.release_version }}/ssdlc-compliance-${{ inputs.release_version }}-${{ steps.date.outputs.date }}.md
          if-no-files-found: error 
