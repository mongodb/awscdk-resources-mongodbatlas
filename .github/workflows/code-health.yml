---
name: Code Health
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
jobs:
  # TEMPORARY: validates ECR access for SilkBomb, remove before merge.
  silkbomb-ecr-access:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_ROLE_ARN: ${{ vars.ECR_ROLE_ARN }}
      SILKBOMB_IMG: ${{ vars.SILKBOMB_IMG }}
    steps:
      - name: Configure AWS credentials for DevProd Platforms ECR
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          aws-region: us-east-1
      - name: Authenticate Docker to DevProd Platforms ECR
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker pull "${SILKBOMB_IMG}"
      - name: Verify SilkBomb image is executable
        run: docker run --rm "${SILKBOMB_IMG}" --help
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - name: Install dependencies
        run: npm ci
      - name: compile
        run: npx projen compile
  lint:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - name: Install dependencies
        run: npm ci
      - name: lint
        run: npx projen eslint
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run ShellCheck
        uses: bewuethr/shellcheck-action@80bac2daa9fcf95d648200a793d00060857e6dc4
  check-l1-updated:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm install -g cdk-import
      - run: ./scripts/cdk-all.sh
      - run: npx projen build
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch > .repo.patch
          if [ -s .repo.patch ]; then
            echo "self_mutation_happened=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: .repo.patch
          path: .repo.patch
          include-hidden-files: true
      - name: Fail build on mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat .repo.patch
          exit 1
  check-examples:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm install -g cdk
      - run: npx projen build
      - run: npx projen package:js 
      - run: ./scripts/check-examples.sh
  call-package-workflow:
    needs: [compile, lint, shellcheck, check-l1-updated, check-examples]
    secrets: inherit
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/package.yml

